# Nginx config for serving the React SPA inside the frontend container.
# The root docker-compose nginx service handles SSL termination and
# routing between frontend and backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other routes → index.html (SPA client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
