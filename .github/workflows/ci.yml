# ─── DocuMind AI — GitHub Actions CI/CD ─────────────────────────────────────
#
# Triggers: push/PR to main or develop
#
# Pipeline:
#   backend-test   → install deps → lint → pytest
#   frontend-test  → install deps → tsc → build
#   docker-build   → build images (only on main push)

name: DocuMind AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION:   "20"

# ─── Backend Tests ────────────────────────────────────────────────────────────

jobs:
  backend-test:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB:       documind_test
          POSTGRES_USER:     documind
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U documind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest pytest-django

      - name: Run Django system checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings_dev
          DB_NAME:     documind_test
          DB_USER:     documind
          DB_PASSWORD: testpassword
          DB_HOST:     localhost
          DB_PORT:     "5432"
          REDIS_URL:   redis://localhost:6379/0
          LLM_API_KEY: ""
        run: python manage.py check --settings=config.settings_dev

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings_dev
          DB_NAME:     documind_test
          DB_USER:     documind
          DB_PASSWORD: testpassword
          DB_HOST:     localhost
          DB_PORT:     "5432"
          REDIS_URL:   redis://localhost:6379/0
        run: python manage.py migrate --settings=config.settings_dev

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings_dev
          DB_NAME:     documind_test
          DB_USER:     documind
          DB_PASSWORD: testpassword
          DB_HOST:     localhost
          DB_PORT:     "5432"
          REDIS_URL:   redis://localhost:6379/0
          LLM_API_KEY: ""
        run: pytest tests/ -v --tb=short

      - name: Check for pending migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings_dev
          DB_NAME:     documind_test
          DB_USER:     documind
          DB_PASSWORD: testpassword
          DB_HOST:     localhost
          DB_PORT:     "5432"
          REDIS_URL:   redis://localhost:6379/0
        run: python manage.py migrate --check --settings=config.settings_dev


# ─── Frontend Tests ───────────────────────────────────────────────────────────

  frontend-test:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build production bundle
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7


# ─── Docker Build (main branch only) ─────────────────────────────────────────

  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: documind-backend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: documind-frontend:latest
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to:   type=gha,mode=max


# ─── Secret scanning ──────────────────────────────────────────────────────────

  security-scan:
    name: Security — Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
