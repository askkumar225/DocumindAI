# ─── DocuMind AI — Docker Compose ────────────────────────────────────────────
#
# Services:
#   postgres   — PostgreSQL 16 with pgvector extension
#   redis      — Redis 7 (Celery broker + result backend)
#   backend    — Django + Gunicorn (port 8000)
#   celery     — Celery worker (background document processing)
#   frontend   — React production build served by Nginx (port 80)
#   nginx      — Reverse proxy: routes /api/* → backend, /* → frontend
#
# Usage:
#   cp .env.example .env          # fill in real values
#   docker compose up --build -d  # start all services
#   docker compose logs -f        # follow logs
#   docker compose down -v        # stop + remove volumes
#
# Access:
#   App:    http://localhost
#   API:    http://localhost/api/
#   Admin:  http://localhost/admin/

version: "3.9"

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings_prod
  SECRET_KEY:             ${SECRET_KEY}
  DB_NAME:                ${DB_NAME:-documind}
  DB_USER:                ${DB_USER:-documind}
  DB_PASSWORD:            ${DB_PASSWORD}
  DB_HOST:                postgres
  DB_PORT:                "5432"
  REDIS_URL:              redis://redis:6379/0
  LLM_PROVIDER:           ${LLM_PROVIDER:-openai}
  LLM_API_KEY:            ${LLM_API_KEY:-}
  LLM_MODEL:              ${LLM_MODEL:-gpt-4o-mini}
  EMBEDDING_MODEL:        ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIM:          ${EMBEDDING_DIM:-1536}
  ALLOWED_HOSTS:          ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  CORS_ALLOWED_ORIGINS:   ${CORS_ALLOWED_ORIGINS:-http://localhost}
  USE_PGVECTOR:           "True"
  AI_MAX_INPUT_CHARS:     "12000"


services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-documind}
      POSTGRES_USER:     ${DB_USER:-documind}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-documind} -d ${DB_NAME:-documind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --worker-class gthread
               --threads 2
               --timeout 120
               --access-logfile -
               --error-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A config worker
        --loglevel=info
        --concurrency=2
        --pool=prefork
        -Q celery

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - backend
      - frontend


# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
