[pytest]
DJANGO_SETTINGS_MODULE = config.settings_dev
python_files            = tests/test_*.py
python_classes          = Test*
python_functions        = test_*
addopts                 = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow (skip with -m "not slow")
    integration: marks tests that require running services (DB, Redis)
